dataset_name: cicandmal2017
source_root: SourceData/CICAndMal2017
split:
  strategy: group_by_capture
  group_key: capture_id
  seed: 42
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
tls_filter:
  enabled: true
  min_record_len: 1
  max_record_len: 18432
feature:
  image_size: 28
  token_max_len: 256
  leakage_reduced: false
